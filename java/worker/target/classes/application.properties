# Application name
spring.application.name=assets-manager-worker

# Messaging Configuration - Azure Service Bus
# Authentication uses Azure Managed Identity (passwordless); no connection string, key, or secret is stored
# in code, config, or Git. The Service Bus client always connects over AMQP/TLS (not configurable to plaintext).
# 1. Do not set any connection-string property; a token is retrieved automatically via managed identity.
# 2. For system-assigned managed identity only, "spring.cloud.azure.credential.client-id" can be omitted.
# 3. Least-privilege: the managed identity must only be granted the "Azure Service Bus Data Receiver" role
#    (scoped to the image-processing queue), never Owner/management permissions. The queue itself is
#    provisioned out-of-band by infrastructure, not by this application.
# 4. Set the environment variables below per environment; no default values are hardcoded here.
spring.cloud.azure.credential.managed-identity-enabled=true
spring.cloud.azure.credential.client-id=${AZURE_MANAGED_IDENTITY_CLIENT_ID:}
spring.cloud.azure.servicebus.namespace=${SERVICE_BUS_NAMESPACE}
spring.cloud.azure.servicebus.entity-type=queue

# Storage Configuration - Azure Blob Storage (private container)
# Shared by both the dev profile (replacing its previous local-filesystem "../storage" directory
# persistence) and the non-dev/object-storage profile (replacing the previous AWS S3 persistence).
# Authentication uses Azure Managed Identity (passwordless), shared with the "spring.cloud.azure.credential.*"
# settings above; no account key or connection string is stored in code, config, or Git.
# 1. Do not set spring.cloud.azure.storage.blob.account-key or .connection-string; a token is
#    retrieved automatically via managed identity.
# 2. Least-privilege: the managed identity must only be granted "Storage Blob Data Contributor"
#    (or "Storage Blob Data Reader" for read-only needs), scoped to the single container below,
#    never Owner/management permissions. The container is expected to be provisioned out-of-band
#    by infrastructure; the application only performs a best-effort create-if-missing at startup
#    and otherwise tolerates lacking container-management rights.
# 3. The container is always private: no public/anonymous access level is ever configured, and the
#    application never generates a SAS URL for it (bytes are streamed through the app instead of
#    redirecting clients to a Blob URL).
# 4. Set the environment variables below per environment; no default endpoint is hardcoded here.
spring.cloud.azure.storage.blob.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT}
azure.storage.blob.container-name=${AZURE_STORAGE_CONTAINER_NAME:assets}

# Database Configuration - Azure Database for PostgreSQL Flexible Server
# Authentication uses Azure Managed Identity (passwordless); no password is stored in code, config, or Git.
# 1. Do not set spring.datasource.password; an access token is retrieved automatically and used as the password.
# 2. For system-assigned managed identity only, "spring.cloud.azure.credential.client-id" can be omitted.
# 3. For service principal auth (e.g. local/dev or CI), remove "spring.cloud.azure.credential.managed-identity-enabled"
#    below and add instead:
#      spring.cloud.azure.profile.tenant-id=${AZURE_TENANT_ID}
#      spring.cloud.azure.credential.client-id=${AZURE_CLIENT_ID}
#      spring.cloud.azure.credential.client-secret=${AZURE_CLIENT_SECRET}
# 4. For Azure sovereign clouds, set the following two properties (the default "azure" cloud type can be omitted):
#      spring.cloud.azure.profile.cloud-type=azure_china / azure_germany / azure_us_government / azure
#      spring.datasource.azure.scopes=<scope-for-your-cloud>
#        azure_china:         https://ossrdbms-aad.database.chinacloudapi.cn/.default
#        azure_germany:       https://ossrdbms-aad.database.cloudapi.de/.default
#        azure_us_government: https://ossrdbms-aad.database.usgovcloudapi.net/.default
#        azure (public):      https://ossrdbms-aad.database.windows.net/.default
# 5. The application database principal (POSTGRESQL_USERNAME, the managed identity granted least-privilege
#    database-level grants on assets_manager) is distinct from ARM/control-plane roles and from the operator
#    identity that runs the one-time provisioning/grant script; it must never be used for ARM operations.
# 6. Set the environment variables below per environment; no default credential values are hardcoded here.
spring.datasource.url=jdbc:postgresql://${POSTGRESQL_SERVER}.postgres.database.azure.com:${POSTGRESQL_PORT:5432}/${POSTGRESQL_DATABASE:assets_manager}?sslmode=require
spring.datasource.username=${POSTGRESQL_USERNAME}
spring.datasource.azure.passwordless-enabled=true
spring.cloud.azure.credential.managed-identity-enabled=true
spring.cloud.azure.credential.client-id=${AZURE_MANAGED_IDENTITY_CLIENT_ID:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect