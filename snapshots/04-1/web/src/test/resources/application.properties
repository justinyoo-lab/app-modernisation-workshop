# Test-only datasource configuration.
#
# Unit tests must never connect to a live database. This profile points
# @DataJpaTest-based repository tests at an in-memory H2 database instead of
# the Azure Database for PostgreSQL Flexible Server used at runtime, and
# overrides the production spring.datasource.* / spring.cloud.azure.* values
# so tests never require Azure credentials or a managed identity to run.
spring.datasource.url=jdbc:h2:mem:assets_manager_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.azure.passwordless-enabled=false
spring.cloud.azure.credential.managed-identity-enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
assets.outbox.publisher.enabled=false

# Carried over from src/main/resources/application.properties: this test resource file fully
# shadows the main one on the classpath (same relative path), so the production multipart limits
# must be restated here for TC-WEB-004 (MaxUploadSizeExceededException boundary) to be exercised.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Test-only Azure Blob Storage / Service Bus placeholders.
#
# These are NOT real resource identifiers: every *PostMigrationIT test mocks the
# BlobContainerClient and ServiceBusTemplate beans at the SDK boundary (see
# infra-decision-table.md, Decision = mock for every dependency), so these client
# objects are only ever constructed, never used to make a network call. They exist
# solely to satisfy Spring property-placeholder resolution (${AZURE_STORAGE_BLOB_ENDPOINT}
# / ${SERVICE_BUS_NAMESPACE} have no default in application.properties) so the full
# application context can boot under test.
spring.cloud.azure.storage.blob.endpoint=https://test-storage-account.blob.core.windows.net
azure.storage.blob.container-name=test-assets-container
spring.cloud.azure.servicebus.namespace=test-namespace.servicebus.windows.net
